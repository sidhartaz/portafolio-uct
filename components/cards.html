<!-- ================================================
     COMPONENTE: CARDS DE PROYECTOS
     Reutilizable para la sección de proyectos
     Uso: copiar y adaptar data-category, tags, título, descripción
================================================ -->

<!-- Project Card Template -->
<div class="col-md-6 col-lg-4 project-item" data-category="web" data-animate="fade-up">
  <div class="project-card">
    <div class="project-thumb">
      <div class="project-thumb-bg bg-project-1">
        <i class="bi bi-shop project-icon"></i>
      </div>
      <div class="project-overlay">
        <a href="#" class="overlay-link" aria-label="Ver demo"><i class="bi bi-eye"></i></a>
        <a href="#" class="overlay-link" aria-label="Ver código"><i class="bi bi-github"></i></a>
      </div>
    </div>
    <div class="project-info">
      <div class="project-tags">
        <span class="p-tag">HTML</span>
        <span class="p-tag">CSS</span>
        <span class="p-tag">JS</span>
      </div>
      <h5 class="project-title">Título del Proyecto</h5>
      <p class="project-desc">
        Descripción del proyecto. Explica qué hace, qué tecnologías usa y su impacto.
      </p>
      <div class="project-actions">
        <a href="#" class="btn-project-demo">
          <i class="bi bi-play-circle"></i> Demo
        </a>
        <a href="#" class="btn-project-gh">
          <i class="bi bi-github"></i> GitHub
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Featured Project Card Template -->
<div class="col-md-6 col-lg-4 project-item" data-category="web" data-animate="fade-up">
  <div class="project-card featured-project">
    <div class="featured-badge"><i class="bi bi-star-fill"></i> Destacado</div>
    <div class="project-thumb">
      <div class="project-thumb-bg bg-project-6">
        <i class="bi bi-broadcast project-icon"></i>
      </div>
      <div class="project-overlay">
        <a href="#" class="overlay-link" aria-label="Ver demo"><i class="bi bi-eye"></i></a>
        <a href="#" class="overlay-link" aria-label="Ver código"><i class="bi bi-github"></i></a>
      </div>
    </div>
    <div class="project-info">
      <div class="project-tags">
        <span class="p-tag">Node.js</span>
        <span class="p-tag">Socket.io</span>
      </div>
      <h5 class="project-title">Proyecto Destacado</h5>
      <p class="project-desc">
        Descripción del proyecto destacado con todas las características principales.
      </p>
      <div class="project-actions">
        <a href="#" class="btn-project-demo">
          <i class="bi bi-play-circle"></i> Demo
        </a>
        <a href="#" class="btn-project-gh">
          <i class="bi bi-github"></i> GitHub
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Info Card Template (para sección Sobre Mí) -->
<div class="col-sm-6">
  <div class="info-card">
    <div class="info-card-icon">
      <i class="bi bi-mortarboard-fill"></i>
    </div>
    <h5>Título</h5>
    <p>Contenido<br /><small>Detalle adicional</small></p>
  </div>
</div>
