<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Carlos Sepúlveda</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* Estilos de emergencia por si el style.css falla */
        body {
            background-color: #0d1117 !important; /* Tu --bg-primary */
            color: #e6edf3 !important;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #161b22; /* Tu --bg-secondary */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(15, 247, 200, 0.15); /* Tu brillo neón */
            z-index: 10;
        }
        .brand-logo {
            font-family: 'Space Mono', monospace;
            color: #0ff7c8; /* Tu --accent-1 */
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1rem;
        }
        .btn-login {
            background-color: #0ff7c8;
            color: #0d1117;
            border: none;
            font-weight: bold;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            transition: 0.3s;
        }
        .btn-login:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-logo">&lt; AR /&gt;</div>
        <h4 class="text-center mb-4">Iniciar Sesión</h4>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small text-uppercase">Email</label>
                <input type="email" id="email" class="form-control bg-dark text-white border-secondary" required placeholder="admin@uct.cl">
            </div>
            <div class="mb-3">
                <label class="form-label small text-uppercase">Contraseña</label>
                <input type="password" id="password" class="form-control bg-dark text-white border-secondary" required placeholder="123456">
            </div>
            <button type="submit" class="btn-login mt-3">AUTENTICAR</button>
        </form>

        <div id="mensaje" class="mt-3"></div>

        <div class="text-center mt-4">
            <a href="../index.html" class="text-secondary small text-decoration-none">← Volver al Terminal</a>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
